<html lang="zh-CN">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            position: relative;
            overflow: hidden;
        }

        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #e0e0e0 0%, #0a0a0a 100%);
            transition: background 3s ease-in-out;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(20, 20, 20, 0.7);
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(200, 200, 200, 0.2);
            padding: 50px 40px;
            text-align: center;
            position: relative;
            z-index: 2;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #homePage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        #articlePage {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* 自定义滚动条 */
        #articlePage::-webkit-scrollbar {
            width: 4px;
        }
        #articlePage::-webkit-scrollbar-track {
            background: transparent;
        }
        #articlePage::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 10px;
        }

        .logo {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #333, #555);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 40px auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
        }

        .logo::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, rgba(255, 255, 255, 0.3), transparent 30%);
            animation: rotate 6s linear infinite;
        }

        .logo-inner {
            width: 130px;
            height: 130px;
            background: linear-gradient(135deg, #222, #444);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .paper-boat {
            position: relative;
            width: 80px;
            height: 60px;
            transform: translateY(5px);
        }

        .boat-body {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25px;
            background: white;
            clip-path: polygon(0% 0%, 100% 0%, 80% 100%, 20% 100%);
        }

        .boat-sail {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 40px solid white;
        }

        .boat-mast {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 45px;
            background: white;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            background: linear-gradient(to right, #fff, #e0e0e0, #d0d0d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 30px;
            color: #eee;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 350px;
        }

        .download-btn,
        .article-btn {
            display: inline-block;
            background: linear-gradient(to right, #333, #555);
            color: white;
            border: none;
            padding: 16px 30px;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        .download-btn:hover,
        .article-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.2);
            background: linear-gradient(to right, #444, #666);
        }

        .download-btn i,
        .article-btn i {
            font-size: 1.5rem;
        }

        .article-btn {
            background: linear-gradient(to right, #4a4a4a, #6a6a6a);
        }

        .article-btn:hover {
            background: linear-gradient(to right, #5a5a5a, #7a7a7a);
        }

        .footer {
            margin-top: 40px;
            font-size: 0.9rem;
            opacity: 0.6;
            color: #ccc;
        }

        .article-text {
            font-size: 1.1rem;
            line-height: 1.8;
            text-align: left;
            width: 100%;
            max-width: 500px;
            color: #f0f0f0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .article-text p {
            margin-bottom: 1em;
        }

        /* ── 文章底部图片 ── */
        .article-image {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 25px auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: rgba(0, 0, 0, 0.3);
        }

        .article-image:hover {
            transform: scale(1.01);
            box-shadow: 0 12px 40px rgba(255, 255, 255, 0.08);
        }

        .article-image img {
            display: block;
            width: 100%;
            height: auto;
            vertical-align: middle;
        }

        .back-btn {
            background: linear-gradient(to right, #444, #666);
            padding: 12px 35px;
            border-radius: 12px;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.2);
            background: linear-gradient(to right, #555, #777);
        }

        @media (max-width:480px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 2.2rem;
            }
            .download-btn,
            .article-btn {
                font-size: 1.1rem;
                padding: 14px 20px;
            }
            .logo {
                width: 110px;
                height: 110px;
            }
            .logo-inner {
                width: 100px;
                height: 100px;
            }
            .paper-boat {
                width: 60px;
                height: 45px;
            }
            .boat-sail {
                border-left-width: 15px;
                border-right-width: 15px;
                border-bottom-width: 30px;
            }
            .boat-mast {
                height: 35px;
            }
            .boat-body {
                height: 20px;
            }
            .article-text {
                font-size: 1rem;
            }
        }
    </style>
